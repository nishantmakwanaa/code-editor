# GitHub Actions workflow for keeping the Render backend warm.
# Features:
# - Scheduled ping every 10 minutes
# - Manual trigger support
# - Normal HTTP GET request to backend root route
#
# By Nishant Makwana (https://nishantmakwanaa.lovable.app)

name: 🔁 Render Keepalive
permissions:
  contents: read
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: 🛰️ Ping Render Backend
    runs-on: ubuntu-latest
    env:
      RENDER_SERVER_URL: ${{ vars.RENDER_SERVER_URL || 'https://code-editor-s0l9.onrender.com/' }}
    steps:
      - name: 🌐 Send keepalive request
        run: curl --silent --show-error --fail --max-time 30 "$RENDER_SERVER_URL"
